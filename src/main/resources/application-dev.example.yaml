server:
  port: 8282
spring:
  application:
    name: stripe-checkout-demo
  datasource:
    url: jdbc:postgresql://localhost:5432/change_me
    username: change_me
    password: change_me
  jpa:
    hibernate:
      ddl-auto: update
      open-in-view: false
  flyway:
