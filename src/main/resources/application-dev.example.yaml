stripe:
  secret-key: sk_test_REPLACE_ME
  webhook-secret: whsec_REPLACE_ME
  success-url: http://localhost:8282/success.html?session_id={CHECKOUT_SESSION_ID}
  cancel-url: http://localhost:8080/cancel.html
